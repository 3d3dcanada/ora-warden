[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ora-warden"
version = "0.1.0"
description = "A fail-closed MCP server that gives local AI agents a governed shell, human approval queue, and tamper-evident audit — your agent can't delete, spend, or exfiltrate without your yes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Randall Marshall", email = "info@3d3d.ca" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "governance", "security", "guardrails", "audit", "fail-closed", "agent-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  # Upper bound is load-bearing, not caution. `mcp` 2.0.0 removed `mcp.server.fastmcp`, which
  # ora_warden/server.py imports, so an unbounded ">=1.2.0" resolved to 2.x on any fresh install and
  # the documented command died on import before printing a single tool:
  #     ModuleNotFoundError: No module named 'mcp.server.fastmcp'
  # Caught 2026-08-12 by actually running `uvx --from git+... ora-warden` in a clean environment
  # rather than reading the command and assuming. Porting to the 2.x server API is real work and is
  # tracked separately; until then this pin is what makes the install work for a stranger.
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "jsonschema>=4.21",
  "pytest>=8",
]

[project.urls]
Homepage = "https://ora.3d3d.ca"
Repository = "https://github.com/3d3dcanada/ora-warden"
Issues = "https://github.com/3d3dcanada/ora-warden/issues"

[project.scripts]
ora-warden = "ora_warden.server:main"
ora-warden-broker = "ora_warden.broker:main"

[tool.hatch.build.targets.wheel]
packages = ["ora_warden"]
